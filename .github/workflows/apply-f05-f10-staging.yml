name: Apply F-05 F-10 staging migration once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Apply the one staging migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set on this repository." >&2
            exit 1
          fi
          python3 - << 'PY'
          import json, os, urllib.error, urllib.request
          sql = open("supabase/migrations/20261021192300_f05_f10_permanent_appeal_and_deletion_hold.sql").read()
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/qqintbwoalvoegvqoxlo/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as res:
                  print("HTTP", res.status)
          except urllib.error.HTTPError as err:
              body = err.read().decode("utf-8", "replace")[:500].replace(token, "[redacted]")
              print("HTTP", err.code)
              print(body)
              raise SystemExit(1)
          PY
