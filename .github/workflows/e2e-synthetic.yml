name: Authenticated synthetic E2E release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-e2e:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_URL: https://qqintbwoalvoegvqoxlo.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_HuzOX6mv9QBruN_8Ct3n6Q_CFNrt4pe
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Require encrypted staging admin credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured in GitHub Actions secrets." >&2
            echo "This release gate will not weaken RLS or store a service-role key in the repository." >&2
            exit 1
          fi

      - name: Clean dependency installation
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate staging admin credential
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/auth/v1/admin/users?page=1&per_page=1")
          if [ "$status" != "200" ]; then
            echo "Staging admin credential validation failed with HTTP ${status}." >&2
            exit 1
          fi
          echo "Staging admin credential validated."

      - name: Run deterministic authenticated Build 03 journey
        run: node scripts/e2e-live.mjs

# This gate may run for same-repository pull requests because repository secrets
# remain unavailable to forks. Disposable staging users are service-role seeded,
# confirmed, exercised through authenticated public clients under RLS, and then
# removed. Public enrollment remains paused.
