name: Issue 17 evidence purge (staging)

# Issue #17 checklist item C. Staging only (qqintbwoalvoegvqoxlo).
# Schedule approved by Marquis on 2026-10-31 (item C): the schedule trigger
# itself is the recorded approval for staging-only scheduled runs. Manual
# runs still require hosted_approved=true. Remove the schedule to stop it.
on:
  workflow_dispatch:
    inputs:
      hosted_approved:
        description: 'Separate founder approval for issue17 staging evidence cleanup run is recorded'
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'  # every 15 min (UTC; same in America/New_York). Approved 2026-10-31.

permissions:
  contents: read

concurrency:
  group: issue17-evidence-purge-staging
  cancel-in-progress: false

jobs:
  purge:
    if: github.event_name == 'schedule' || inputs.hosted_approved
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://qqintbwoalvoegvqoxlo.supabase.co
      ISSUE17_HOSTED_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Staging-only guard
        id: guard
        run: |
          set -euo pipefail
          if [ "${SUPABASE_URL}" != "https://qqintbwoalvoegvqoxlo.supabase.co" ]; then
            echo "Refusing: SUPABASE_URL is not the staging project." >&2
            exit 1
          fi
          if [ ! -f scripts/purge-moderation-evidence.mjs ]; then
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "::notice::Purger not on this ref yet (lands with PR #21); scheduled run skipped, nothing deleted."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Purger not present on this ref (lands with PR #21)." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.ready == 'true'

      - run: npm run test:issue17:purger
        if: steps.guard.outputs.ready == 'true'

      - name: Run staging evidence purge
        if: steps.guard.outputs.ready == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not set." >&2
            exit 1
          fi
          mkdir -p /tmp/issue17-purge
          node scripts/purge-moderation-evidence.mjs > /tmp/issue17-purge/result.json 2> /tmp/issue17-purge/stderr.log
          cat /tmp/issue17-purge/result.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.ready == 'true'
        with:
          name: issue17-evidence-purge-staging
          path: /tmp/issue17-purge/
          if-no-files-found: warn
          retention-days: 30
