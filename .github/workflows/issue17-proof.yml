name: Issue 17 draft proof
on:
  pull_request:
    branches: [main, feature/build-03-milestone-delta, fix/grant-rls-least-privilege]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'package*.json'
      - '.github/workflows/issue17-proof.yml'
  workflow_dispatch:
    inputs:
      hosted_approved:
        description: 'Separate founder approval for issue17 staging schema, private bucket, retention, and cleanup activation is recorded'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run test:issue17:sql && npm run test:issue17:purger
        env:
          ISSUE17_SQL_REPORT: /tmp/issue17-sql-results.json
      - run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_ENABLE_ENROLLMENT: 'false'
          VITE_SUPABASE_URL: https://qqintbwoalvoegvqoxlo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: local-preview-only-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue17-local-sql-proof
          path: /tmp/issue17-sql-results.json
          retention-days: 30
  baseline-authenticated:
    # Existing staging controls only; this cannot close the new issue17 flow.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/e2e-live.mjs
        env:
          SUPABASE_URL: https://qqintbwoalvoegvqoxlo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_HuzOX6mv9QBruN_8Ct3n6Q_CFNrt4pe
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  complete-hosted-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_approved
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:issue17:live
        env:
          ISSUE17_HOSTED_APPROVED: 'true'
          ISSUE17_SOURCE_SHA: ${{ github.sha }}
          SUPABASE_URL: https://qqintbwoalvoegvqoxlo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_HuzOX6mv9QBruN_8Ct3n6Q_CFNrt4pe
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue17-authenticated-hosted-proof
          path: /tmp/issue17-live-results.json
          retention-days: 30
