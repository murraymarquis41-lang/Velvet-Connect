name: Live staging release smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployed GitHub Pages surface
        shell: bash
        run: |
          set -euo pipefail
          URL="https://murraymarquis41-lang.github.io/Velvet-Connect/"
          for attempt in $(seq 1 18); do
            if curl -fsSL --retry 2 --retry-delay 2 "$URL" -o /tmp/velvet.html; then
              if grep -q "Velvet Connect" /tmp/velvet.html && grep -q "STAGING · SYNTHETIC TEST ACCOUNTS ONLY" /tmp/velvet.html; then
                echo "Public Pages surface verified: $URL"
                exit 0
              fi
            fi
            echo "Waiting for current Pages deployment (attempt $attempt/18)..."
            sleep 10
          done
          echo "Expected Velvet Connect staging content was not observed at $URL" >&2
          exit 1

      - name: Verify Supabase Auth service health
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_HuzOX6mv9QBruN_8Ct3n6Q_CFNrt4pe
        run: |
          set -euo pipefail
          curl -fsS \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "https://qqintbwoalvoegvqoxlo.supabase.co/auth/v1/health" \
            -o /tmp/auth-health.json
          grep -q '"name":"GoTrue"' /tmp/auth-health.json
          cat /tmp/auth-health.json

      - name: Verify Supabase REST key and anonymous RLS protection
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_HuzOX6mv9QBruN_8Ct3n6Q_CFNrt4pe
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/profiles.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "https://qqintbwoalvoegvqoxlo.supabase.co/rest/v1/profiles?select=id&limit=1")
          BODY=$(tr -d '[:space:]' < /tmp/profiles.json)
          echo "Profiles probe HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            test "$BODY" = "[]"
            echo "Supabase REST reached successfully; anonymous profile query returned no rows under RLS."
          elif [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "Supabase REST reached successfully; anonymous profile access was explicitly denied."
          else
            echo "Unexpected Supabase REST response: HTTP $STATUS" >&2
            cat /tmp/profiles.json >&2
            exit 1
          fi

# Verification workflow intentionally retained as a release gate.
