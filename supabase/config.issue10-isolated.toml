# Disposable local issue #10 verification only. Never link or deploy this config.
# Supabase CLI 2.119.0 native stack; matches hosted PostgreSQL major 17.
project_id = "velvet-issue10-isolated"

[experimental]
stack = true

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "8MiB"

[studio]
enabled = false
